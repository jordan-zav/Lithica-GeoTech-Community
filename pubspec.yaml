name: lithica_geotech
description: "Plataforma y base de conocimiento geotécnica versionada de la familia Lithica."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  yaml: ^3.1.3
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.5
  cloud_firestore: ^6.7.0
  crypto: ^3.0.7
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/config/

flutter_launcher_icons:
  android: true
  image_path_android: assets/branding/logo.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/logo.png
  adaptive_icon_foreground_inset: 18
  windows:
    generate: true
    image_path: assets/branding/logo.jpg
    icon_size: 256
  web:
    generate: true
    image_path: assets/branding/logo.jpg
    background_color: "#071827"
    theme_color: "#071827"
